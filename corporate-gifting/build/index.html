    }
    return value.startsWith("/") ? base + value : value;
  };
  const fixImg = (img) => {
    const src = img.getAttribute("src");
    const next = prefixSrc(src);
    if (next !== src) img.setAttribute("src", next);
  };
  const scan = (root) => {
    if (root instanceof HTMLImageElement) fixImg(root);
    root.querySelectorAll?.("img").forEach(fixImg);

    if (url.origin !== location.origin || samePage(url)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = url.href;
  }, true);
})();
